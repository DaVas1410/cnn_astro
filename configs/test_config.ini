[dataset]
output_file = test_dataset.h5
batch_size = 2
num_images = 4
image_width = 64
image_height = 64
image_depth = 1
k_values = 2,4,8
k_max_values = auto,32,auto

[distribution]
mean = 1.0
sigma = 2.236067977  # np.sqrt(5)
beta = -1.666666667  # -5/3
mean_values = 1.0,2.0
sigma_values = 2.0
beta_values = -1.5,-2.0

[fractal]
ni = 64
nj = 64
nk = 1
verbose = false
random_seed = random

[hdf5]
compression = gzip
compression_opts = 1
chunks_auto = true
chunk_size_images = auto
chunk_size_labels = auto

[processing]
memory_monitoring = true
progress_reporting = false
progress_report_interval = 1
clear_memory_after_batch = true
force_garbage_collection = true
num_workers = 1

[logging]
enable_logging = true
log_file = logs/test_dataset_generation.log
log_level = DEBUG
console_output = false
file_output = true
log_format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s

[metadata]
dataset_name = Test Fractal Dataset
description = Test dataset for unit testing
author = Test Suite
version = 1.0.0
method = test
store_creation_date = true
store_parameters = true

[validation]
validate_after_creation = false
check_nans = true
check_infs = true
fail_on_invalid = false
check_finite_values = true
log_statistics = false

