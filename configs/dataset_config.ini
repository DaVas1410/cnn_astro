[dataset]
# Output file settings
output_file = fractal_dataset.h5
batch_size = 10

# Dataset dimensions
num_images = 1000
image_width = 512
image_height = 512
image_depth = 1

# K-values for fractal generation
k_values = 2,4,8,16,32,64
k_max_values = auto

[distribution]
# Log Normal Distribution parameters
mean = 1.0
sigma = np.sqrt(5.)
beta = -5. / 3.

[fractal]
# Fractal cube generation parameters
ni = 512
nj = 512
nk = 1
verbose = false
random_seed = random

[hdf5]
# HDF5 file settings
compression = gzip
compression_opts = 1
chunks_auto = true
chunk_size_images = 1,512,512
chunk_size_labels = auto

[processing]
# Memory and processing settings
memory_monitoring = true
progress_reporting = true
progress_report_interval = 2
clear_memory_after_batch = true
force_garbage_collection = true

# Parallel processing
# num_workers = 1  --> Serial mode (1 process)
# num_workers = 4  --> Parallel mode (4 worker processes)
# Set to number of CPU cores for best performance (e.g., 4, 8, 16)
num_workers = 1

[metadata]
# Metadata to store in HDF5
method = lognormal
store_creation_date = true
store_parameters = true

[validation]
# Validation settings
validate_after_creation = true
check_finite_values = true
log_statistics = true

[logging]
# Logging settings
enable_logging = true
log_file = logs/dataset_generation.log
log_level = INFO
log_format = %%(asctime)s - %%(levelname)s - %%(message)s
console_output = false
file_output = true