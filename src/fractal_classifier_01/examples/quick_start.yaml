# Quick Start Configuration for Fractal Classifier
# Minimal settings for testing the pipeline

data:
  h5_path: "fractal_dataset.h5"
  input_shape: [512, 512, 1]
  num_classes: 6

training:
  epochs: 10  # Reduced for quick testing
  batch_size: 4
  learning_rate: 0.0001

paths:
  output_dir: "outputs"
  checkpoint_dir: "checkpoints"
