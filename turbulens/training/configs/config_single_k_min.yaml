extends: config_base.yaml
experiment:
  name: single_k_min
task:
  mode: single_target
  targets: [k_min]
  target_ranges:
    k_min: [1.0, 32.0]
search:
  selection:
    target: k_min
candidate_training:
  selection:
    target: k_min
interpretability:
  enabled: false
stages:
  enabled:
    - validate_data
    - grid_search
    - select_candidates
    - retrain_candidates
    - select_final
    - train_ensemble
    - evaluate_ensemble
    - report
